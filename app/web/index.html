<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Replaced by the `--base-href` argument to `flutter build`. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="description"
        content="A party trivia game: one phone each, one wager each, ten questions of shouting.">

  <!-- Installed app / status bar -->
  <meta name="theme-color" content="#0E0D0C">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fazoura Party">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <title>Fazoura Party</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #0E0D0C;
      overscroll-behavior: none;
    }
    /* Shown until Flutter paints, so a cold start isn't a white flash. */
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      letter-spacing: .28em;
      color: #FFC400;
      font-size: 15px;
      font-weight: 700;
    }
    #splash .bar {
      width: 52px;
      height: 4px;
      background: #FF4D6D;
    }
    /* Flutter inserts <flutter-view> once it takes over the page. */
    body:has(flutter-view) #splash {
      display: none;
    }
  </style>
</head>
<body>
  <div id="splash">
    FAZOURA
    <div class="bar"></div>
  </div>
  <script>
    // Ours is the only registration: tool/build_web.dart writes
    // flutter_service_worker.js and strips Flutter's deprecated one, because two
    // workers claiming "/" would keep replacing each other.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker
          .register('flutter_service_worker.js')
          .catch((error) => console.warn('Offline caching unavailable:', error));
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
