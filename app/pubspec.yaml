name: fazoura_party
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  freezed_annotation: ^3.1.0
  google_fonts: ^8.2.1
  http: ^1.6.0
  image: ^4.10.1
  image_picker: ^1.2.3
  json_annotation: ^4.12.0
  path_provider: ^2.1.6
  phoenix_socket: ^0.8.0
  riverpod_annotation: ^4.0.7
  sembast: ^3.8.10
  sembast_web: ^2.4.6
  shared_preferences: ^2.5.5
  # Web-only: the origin the PWA was served from (core/providers/served_origin_web.dart).
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  # tool/build_web.dart: content hashes for the service worker cache key.
  crypto: ^3.0.6
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  riverpod_generator: ^4.0.9
  freezed: ^4.0.1
  json_serializable: ^6.14.1

flutter:
  uses-material-design: true
  assets:
    # Generated by tool/make_icons.dart from design/icons/fazoura.svg.
    - assets/icon.png
