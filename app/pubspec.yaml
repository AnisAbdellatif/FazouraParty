name: fazoura_party
description: "Fazoura Party — party trivia with wagers. Android and Web client."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  archive: ^4.3.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  freezed_annotation: ^3.1.0
  http: ^1.6.0
  image: ^4.10.1
  image_picker: ^1.2.3
  json_annotation: ^4.12.0
  path_provider: ^2.1.6
  phoenix_socket: ^0.8.0
  riverpod_annotation: ^4.0.7
  sembast: ^3.8.10
  sembast_web: ^2.4.6
  shared_preferences: ^2.5.5
  # Web-only: the origin the PWA was served from (core/providers/served_origin_web.dart).
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  # tool/build_web.dart: content hashes for the service worker cache key.
  crypto: ^3.0.6
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  riverpod_generator: ^4.0.9
  freezed: ^4.0.1
  json_serializable: ^6.14.1

flutter:
  uses-material-design: true
  assets:
    # Generated by tool/make_icons.dart from design/icons/fazoura.svg.
    - assets/icon.png

  # Bundled, not fetched. google_fonts downloads these from fonts.gstatic.com at
  # runtime, which silently falls back to system fonts whenever the network is
  # unavailable — and a LAN party has no internet at all. Shipping them also
  # removes a third-party request from every cloud page load.
  #
  # Figtree and Reem Kufi are variable fonts: one file serves every weight, so
  # each weight below points at the same file and Flutter interpolates.
  fonts:
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree.ttf
          weight: 400
        - asset: assets/fonts/Figtree.ttf
          weight: 500
        - asset: assets/fonts/Figtree.ttf
          weight: 600
        - asset: assets/fonts/Figtree.ttf
          weight: 700
        - asset: assets/fonts/Figtree.ttf
          weight: 800
        - asset: assets/fonts/Figtree.ttf
          weight: 900
    - family: Reem Kufi
      fonts:
        - asset: assets/fonts/ReemKufi.ttf
          weight: 400
        - asset: assets/fonts/ReemKufi.ttf
          weight: 500
        - asset: assets/fonts/ReemKufi.ttf
          weight: 600
        - asset: assets/fonts/ReemKufi.ttf
          weight: 700
    # DM Mono ships as static weights; the design uses regular and medium.
    - family: DM Mono
      fonts:
        - asset: assets/fonts/DMMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMMono-Medium.ttf
          weight: 500
