<?xml version="1.0" encoding="UTF-8"?>
<!-- Google Play feature graphic, 1024x500. Render with store_listing/render.sh. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
  <defs>
    <radialGradient id="glow" cx="0.3" cy="0.45" r="0.75">
      <stop offset="0" stop-color="#0E2E2B"/>
      <stop offset="1" stop-color="#061917"/>
    </radialGradient>
    <!-- The amber lattice woven behind every screen (design/FazouraParty.v2.dc.html). -->
    <pattern id="lattice" width="30" height="30" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect x="0" y="0" width="1.8" height="30" fill="#FFB000" fill-opacity="0.07"/>
      <rect x="0" y="0" width="30" height="1.8" fill="#FFB000" fill-opacity="0.07"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22"/>
      <feOffset dy="18" result="blur"/>
      <feFlood flood-color="#000000" flood-opacity="0.55"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="amberGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="8" result="blur"/>
      <feFlood flood-color="#FFB000" flood-opacity="0.28"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1024" height="500" fill="url(#glow)"/>
  <rect width="1024" height="500" fill="url(#lattice)"/>

  <!-- Wordmark, as on the icon: the Arabic, a pink rule, PARTY -->
  <g text-anchor="middle">
    <text x="270" y="190" font-family="Reem Kufi" font-weight="500" font-size="138" fill="#FFB000" filter="url(#amberGlow)">فزورة</text>
    <rect x="178" y="222" width="184" height="10" rx="2" fill="#FF2D6F"/>
    <text x="270" y="296" font-family="Figtree" font-weight="800" font-size="62" letter-spacing="10" fill="#FBF6EC">PARTY</text>
    <text x="270" y="368" font-family="Figtree" font-weight="600" font-size="29" fill="#FBF6EC">Party trivia for a room full of phones</text>
    <text x="270" y="410" font-family="DM Mono" font-weight="500" font-size="17" letter-spacing="2.5" fill="#FBF6EC" fill-opacity="0.55">HOST · SHARE A CODE · PLAY</text>
  </g>

  <!-- Leaderboard card, behind the phone -->
  <g transform="translate(868 150) rotate(8)" filter="url(#shadow)">
    <rect x="-20" y="0" width="190" height="236" rx="22" fill="#0A2422" stroke="#FBF6EC" stroke-opacity="0.14" stroke-width="1.5"/>
    <g font-family="Figtree" font-weight="700" font-size="15" fill="#FBF6EC">
      <circle cx="16" cy="72" r="12" fill="#4FD39A"/>
      <text x="36" y="77">Lina</text>
      <text x="150" y="77" text-anchor="end" font-family="DM Mono" font-weight="500" fill="#4FD39A">175</text>
      <text x="150" y="50" text-anchor="end" font-family="DM Mono" font-weight="500" font-size="12" fill="#4FD39A">+50</text>
      <circle cx="16" cy="112" r="12" fill="#FF2D6F"/>
      <text x="36" y="117">Sami</text>
      <text x="150" y="117" text-anchor="end" font-family="DM Mono" font-weight="500">140</text>
      <circle cx="16" cy="152" r="12" fill="#7FB2FF"/>
      <text x="36" y="157">Yasmine</text>
      <text x="150" y="157" text-anchor="end" font-family="DM Mono" font-weight="500">95</text>
      <circle cx="16" cy="192" r="12" fill="#C79BFF"/>
      <text x="36" y="197">Omar</text>
      <text x="150" y="197" text-anchor="end" font-family="DM Mono" font-weight="500">60</text>
    </g>
  </g>

  <!-- Phone, mid-question -->
  <g transform="translate(700 58) rotate(-6)" filter="url(#shadow)">
    <rect x="0" y="0" width="236" height="470" rx="34" fill="#061917" stroke="#FBF6EC" stroke-opacity="0.2" stroke-width="2"/>
    <rect x="9" y="9" width="218" height="452" rx="27" fill="#0A2422"/>
    <rect x="9" y="9" width="218" height="452" rx="27" fill="url(#lattice)"/>
    <rect x="93" y="20" width="50" height="7" rx="3.5" fill="#061917"/>

    <text x="26" y="62" font-family="DM Mono" font-weight="500" font-size="12" letter-spacing="1.5" fill="#FBF6EC" fill-opacity="0.55">Q 4 / 10</text>
    <!-- Clock -->
    <circle cx="192" cy="58" r="17" fill="none" stroke="#FBF6EC" stroke-opacity="0.14" stroke-width="4"/>
    <path d="M192 41 A17 17 0 1 1 175.3 61.2" fill="none" stroke="#FFB000" stroke-width="4" stroke-linecap="round"/>
    <text x="192" y="63" text-anchor="middle" font-family="DM Mono" font-weight="500" font-size="14" fill="#FBF6EC">18</text>

    <rect x="26" y="88" width="98" height="24" rx="12" fill="#FF2D6F" fill-opacity="0.16" stroke="#FF2D6F" stroke-opacity="0.6"/>
    <text x="75" y="104.5" text-anchor="middle" font-family="DM Mono" font-weight="500" font-size="11.5" letter-spacing="1" fill="#FF2D6F">HARD · +50</text>
    <text x="26" y="142" font-family="DM Mono" font-weight="500" font-size="11.5" letter-spacing="2" fill="#FFB000">GEOGRAPHY</text>

    <g font-family="Figtree" font-weight="700" font-size="23" fill="#FBF6EC">
      <text x="26" y="178">Which country</text>
      <text x="26" y="207">has the most</text>
      <text x="26" y="236">pyramids?</text>
    </g>

    <rect x="26" y="300" width="184" height="50" rx="14" fill="#FBF6EC" fill-opacity="0.06" stroke="#FFB000" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="42" y="331" font-family="Figtree" font-weight="600" font-size="18" fill="#FBF6EC">Sudan</text>
    <rect x="97" y="314" width="2" height="22" fill="#FFB000"/>

    <rect x="26" y="364" width="184" height="50" rx="14" fill="#FFB000"/>
    <text x="118" y="395" text-anchor="middle" font-family="Figtree" font-weight="800" font-size="17" fill="#061917">Lock in</text>
  </g>

  <!-- Room code, stuck on the corner -->
  <g transform="translate(566 104) rotate(-10)" filter="url(#shadow)">
    <rect x="0" y="0" width="150" height="48" rx="14" fill="#FF2D6F"/>
    <text x="75" y="31.5" text-anchor="middle" font-family="DM Mono" font-weight="500" font-size="21" letter-spacing="4" fill="#FBF6EC">K7QX2M</text>
  </g>
</svg>
