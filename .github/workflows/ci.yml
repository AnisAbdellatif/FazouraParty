name: CI

# Every push and pull request runs both suites and builds the image. Only a push to
# main pushes that image to ghcr.io and deploys it to the VPS over SSH.
#
# A `v*` tag is the other thing that happens here: the same suites run, and then the
# signed Android APK is built and published as a GitHub release (README, "Releasing
# the Android app"). Tagging is the only way to cut a release — one path, so a
# hand-built APK can never be the one people are updating to.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  # The checks themselves live in scripts/ci.sh, which is also what a developer runs
  # locally. Repeating the step list here is what lets the two drift, so this workflow
  # only installs toolchains, caches, and calls the script (AGENTS.md §6).
  versions:
    name: Toolchain versions
    runs-on: ubuntu-24.04
    outputs:
      otp: ${{ steps.read.outputs.otp }}
      elixir: ${{ steps.read.outputs.elixir }}
      flutter: ${{ steps.read.outputs.flutter }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # scripts/ci.sh is the single place the pins are written.
      - id: read
        run: |
          sed -n 's/^\([A-Z_]*\)_VERSION="\(.*\)"$/\L\1\E=\2/p' scripts/ci.sh >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  server:
    name: Server (Elixir)
    needs: versions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: ${{ needs.versions.outputs.otp }}
          elixir-version: ${{ needs.versions.outputs.elixir }}

      # The dialyzer PLT is the slow part; it only changes when deps do.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            server/deps
            server/_build
            server/priv/plts
          key: mix-${{ runner.os }}-${{ needs.versions.outputs.elixir }}-${{ needs.versions.outputs.otp }}-${{ hashFiles('server/mix.lock') }}
          restore-keys: mix-${{ runner.os }}-${{ needs.versions.outputs.elixir }}-${{ needs.versions.outputs.otp }}-

      - run: scripts/ci.sh server

  tools:
    name: Tools (fazoura CLI)
    needs: versions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The CLI depends on the app package, which declares Flutter, so it needs
      # the same pinned SDK the app job installs.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ needs.versions.outputs.flutter }}
          channel: stable
          cache: true

      - run: scripts/ci.sh tools

  app:
    name: App (Flutter)
    needs: versions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ needs.versions.outputs.flutter }}
          channel: stable
          cache: true

      - run: scripts/ci.sh app

      # The image ships this build, so the image job takes it from here rather than
      # installing Flutter a second time.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web
          path: app/build/web
          retention-days: 7
          if-no-files-found: error

  image:
    name: Image
    needs: [server, app]
    # A tag neither publishes an image nor deploys, so building one would be five
    # minutes spent on an artifact nothing collects.
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
      tag: ${{ steps.name.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web
          path: app/build/web

      - id: name
        # The commit sha is what gets deployed; `latest` is a convenience alias so
        # manual compose commands on the VPS find the same image.
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      # A pull request builds but never publishes: it is here to catch a broken
      # Dockerfile before main does, not to produce an artifact.
      - id: publish
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_NAME" = main ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to ghcr.io
        if: steps.publish.outputs.push == 'true'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build the image
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          TAG: ${{ steps.name.outputs.tag }}
          PUSH: ${{ steps.publish.outputs.push }}
        # Not scripts/ci.sh: the registry cache and the push are CI's own, and a
        # developer machine has neither. `scripts/ci.sh image` builds the same
        # Dockerfile with the same context, which is the part worth checking locally.
        #
        # A pull request reads the registry cache but does not write it, so it cannot
        # poison the cache main builds from.
        run: |
          args=(--file deploy/Dockerfile --cache-from "type=registry,ref=$IMAGE:buildcache")
          if [ "$PUSH" = true ]; then
            args+=(--cache-to "type=registry,ref=$IMAGE:buildcache,mode=max")
            args+=(--push --tag "$IMAGE:$TAG" --tag "$IMAGE:latest")
          else
            args+=(--output type=cacheonly)
          fi
          docker buildx create --use
          docker buildx build "${args[@]}" .

  deploy:
    name: Deploy
    needs: image
    if: github.event_name == 'push' && github.ref_name == 'main' && vars.DEPLOY_HOST != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    # Deploys queue rather than race; cancelling one halfway would leave the stack
    # between two images.
    concurrency:
      group: deploy-main
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || 'fazoura' }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/srv/fazoura' }}
      # Fail rather than wait for a password or a host key confirmation nobody can type.
      SSH_OPTIONS: -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        # A secret stored only in another environment arrives empty here, which would
        # otherwise fail later with an unhelpful ssh error.
        run: |
          if [ -z "$SSH_KEY" ] || [ -z "$KNOWN_HOSTS" ]; then
            echo "::error::DEPLOY_SSH_KEY or DEPLOY_KNOWN_HOSTS is empty in the 'production' environment. See deploy/README.md."
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

      - name: Copy the stack definition
        # Only this one. deploy/.env belongs to the VPS and is never shipped,
        # packages/ holds what someone put there, and Caddy runs on the host with a
        # configuration this repository does not own.
        run: |
          scp -i ~/.ssh/deploy_key $SSH_OPTIONS -P "$DEPLOY_PORT" \
            deploy/compose.yaml \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

      - name: Make sure the packages drop folder exists
        # compose bind-mounts it, so without this Docker creates it as root and nobody
        # can copy a quiz in without sudo.
        run: |
          ssh -i ~/.ssh/deploy_key $SSH_OPTIONS -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH/packages'"

      - name: Pull, migrate and restart
        env:
          IMAGE: ${{ needs.image.outputs.image }}
          TAG: ${{ needs.image.outputs.tag }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The registry token goes in through stdin, never on a command line, and the
        # session logs out again as soon as the image is local. Migrations run with the
        # new image before the old container stops; Release.setup/0 is idempotent, so a
        # re-run of a failed deploy is safe.
        run: |
          echo "$TOKEN" | ssh -i ~/.ssh/deploy_key $SSH_OPTIONS -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -eu
             cd '$DEPLOY_PATH'
             docker login ghcr.io --username '$GITHUB_ACTOR' --password-stdin
             docker pull '$IMAGE:$TAG'
             docker logout ghcr.io
             docker tag '$IMAGE:$TAG' '$IMAGE:latest'
             export APP_IMAGE='$IMAGE' APP_TAG='$TAG'
             docker compose run --rm --no-TTY app bin/fazoura eval 'Fazoura.Release.setup()'
             docker compose up --detach --wait --remove-orphans
             docker image prune --all --force --filter until=336h"

      - name: Smoke check
        env:
          URL: https://${{ vars.PUBLIC_HOST || vars.DEPLOY_HOST }}/health
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-connrefused "$URL"

  release:
    name: Release (Android)
    # The whole suite, not just the app one: a tag that ships an APK people install
    # by hand is the last place to find out the server was broken.
    needs: [versions, server, app, tools]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    permissions:
      contents: write
    steps:
      # Full history so the tag object — and the message that becomes the release
      # notes — is actually present.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ needs.versions.outputs.flutter }}
          channel: stable
          cache: true

      - name: Unlock the signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        # Every release has to be signed with the same key or Android refuses to
        # install one over another, which is the whole feature. An unset secret
        # fails here with something worth reading rather than inside Gradle.
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is empty in the 'production' environment. See README.md, 'Releasing the Android app'."
            exit 1
          fi
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
          chmod 600 "$RUNNER_TEMP/release.jks"

      - name: Build the APK and its manifest
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # Android is not served from anywhere, so the server it talks to is baked
          # in. PUBLIC_HOST is the same variable the deploy job smoke-checks against.
          PUBLIC_HOST: ${{ vars.PUBLIC_HOST || vars.DEPLOY_HOST }}
          # scripts/ci.sh refuses to build if this disagrees with app/pubspec.yaml.
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$PUBLIC_HOST" ]; then
            echo "::error::Set the PUBLIC_HOST repository variable — an APK pointing at localhost cannot reach a game."
            exit 1
          fi
          scripts/ci.sh apk

      - name: Shred the key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        # android.json is what an installed app reads, and it is fetched through
        # `releases/latest/download/`, so a pre-release must be marked as one or it
        # would be offered to everybody. Anything with a suffix (v1.0.0-rc.1) is one.
        run: |
          args=(--verify-tag --title "Fazoura Party $TAG" --generate-notes)
          case "$TAG" in *-*) args+=(--prerelease) ;; esac
          gh release create "$TAG" "${args[@]}" \
            app/build/release/*.apk \
            app/build/release/android.json
