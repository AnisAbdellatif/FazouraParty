# The production stack: Postgres and the app. TLS is terminated by the Caddy already
# running on the host, which proxies to the port published below — see Caddyfile.
#
# CI copies this file to the VPS and runs compose there; the image is pulled from
# ghcr.io, never built on the VPS. APP_IMAGE and APP_TAG come from the deploy job's
# environment, everything else from the .env beside this file.
#
#   export APP_IMAGE=ghcr.io/<owner>/<repo> APP_TAG=<sha>
#   docker compose run --rm app bin/fazoura eval "Fazoura.Release.setup()"
#   docker compose up --detach --wait --remove-orphans

name: fazoura

services:
  db:
    image: postgres:18-trixie
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fazoura}
      POSTGRES_USER: ${POSTGRES_USER:-fazoura}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      # The parent, not .../data: Postgres 18 keeps its cluster in a versioned
      # subdirectory, and mounting the parent works either way.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fazoura} -d ${POSTGRES_DB:-fazoura}"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    image: ${APP_IMAGE:?set APP_IMAGE, e.g. ghcr.io/owner/repo}:${APP_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-fazoura}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-fazoura}
      # Also in .env, and named here so a deploy without it fails loudly rather than
      # starting on runtime.exs's `example.com` default and building wrong photo URLs.
      PHX_HOST: ${PHX_HOST:?set PHX_HOST in .env}
    # Loopback only. The host's Caddy reaches it here; the internet must not, or a
    # request could arrive without TLS and carry its own X-Forwarded-For — which
    # `TRUST_PROXY=true` tells the app to believe, and rate limiting counts on.
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Published question photos. Losing this loses every photo on every public quiz.
      - uploads:/data/uploads
      # Drop `.fazoura` packages in ./packages beside this file and the next
      # `Fazoura.Release.setup()` seeds them (QUIZ_FORMAT.md §6). A bind mount rather
      # than a named volume, because the whole point is copying a file in by hand.
      # Read-only: seeding reads them and nothing writes back.
      - ./packages:/data/packages:ro
    # Long enough for Rooms.Drain to tell live games the server is going away.
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  pgdata:
  uploads:
