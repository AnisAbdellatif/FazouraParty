# The production image, runnable on a developer machine.
#
# Production runs under Kamal (deploy/deploy.yml); this is the same image and the
# same Postgres, started with compose because a laptop has no kamal-proxy, no Caddy
# and no registry:
#
#   scripts/ci.sh app                 # the image ships app/build/web, so build it first
#   scripts/ci.sh up                  # build, start, migrate, seed, health-check
#   scripts/ci.sh down                # stop it and delete its data
#
# Then the whole game is at http://localhost:4000 — API, WebSocket and client on one
# origin, as in production.
#
# Differences from production, each of which is the reason this file exists:
#
#   * The image is **built from this checkout** instead of pulled from ghcr.io, so
#     what runs is the code in your working tree.
#   * **No TLS and no proxies.** In production the host's Caddy terminates TLS and
#     kamal-proxy swaps containers behind it; here the app's port is published as it
#     is, which is why this is plain http and PHX_HOST is localhost.
#   * Secrets are **throwaway literals** rather than the server's .env, which is
#     never in this repo.
#   * Volumes are **not** the production ones: a local pgdata/uploads pair, so
#     `docker compose down -v` here can never touch anything that matters.

name: fazoura-local

services:
  db:
    image: postgres:18-trixie
    restart: unless-stopped
    environment:
      POSTGRES_DB: fazoura
      POSTGRES_USER: fazoura
      POSTGRES_PASSWORD: local-development-only
    volumes:
      # The parent, not .../data: Postgres 18 keeps its cluster in a versioned
      # subdirectory, and mounting the parent works either way.
      - local_pgdata:/var/lib/postgresql
    # Handy for `psql`; harmless because the password above guards nothing real.
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fazoura -d fazoura"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        # Reached directly over plain HTTP by Android emulators and LAN devices.
        FORCE_SSL: "false"
    image: fazoura:local
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://fazoura:local-development-only@db:5432/fazoura
      SECRET_KEY_BASE: local-development-only-secret-key-base-at-least-64-bytes-long-xxxxxx
      # The endpoint's own host, which WebSocket origin checks are made against:
      # a browser on http://localhost:4000 is allowed in because of it.
      PHX_HOST: localhost
      # Where photo links point. The endpoint's URL would make them
      # https://localhost/..., which is nothing a phone can open, so
      # `scripts/ci.sh up` sets this to the machine's LAN address. Run the stack
      # some other way and it falls back to plain localhost, which is enough for
      # a browser on this machine.
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:4000}
      # The dashboard is worth having locally, but this stack listens on every
      # interface (below), so anybody on the same Wi-Fi can reach it: a fixed
      # admin/admin was a login for all of them. `scripts/ci.sh up` makes a new
      # password each time and prints it; run the stack some other way without
      # setting one and the dashboard is simply not there (it answers 404).
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ${LOCAL_ADMIN_PASSWORD:-}
      # Rate limiting counts per client IP. There is no proxy here, so the socket
      # address is the honest answer and X-Forwarded-For must not be trusted.
      TRUST_PROXY: "false"
      # `flutter run -d chrome` serves the client from a random localhost port, so
      # its requests are cross-origin and the browser would drop the responses
      # without this. Production needs no such allowance: the app is served from
      # the same origin as the API. `:all` is safe *here* because nothing it
      # guards is real, and is exactly what config/dev.exs already does.
      CORS_ORIGINS: "*"
    # No proxy here, and a phone on the same Wi-Fi may want in, so the port goes on
    # every interface.
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - local_uploads:/data/uploads
      # Drop `.fazoura` packages in deploy/packages and the next seed adds them, as
      # on the server (QUIZ_FORMAT.md §6).
      - ./packages:/data/packages:ro
    # Long enough for Rooms.Drain to tell live games the server is going away.
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  # Named apart from production's, so tearing this down is safe.
  local_pgdata:
  local_uploads:
